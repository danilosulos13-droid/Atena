name: ATENA LoRA training and Telegram

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      min_train_examples:
        description: "Mínimo de exemplos SFT para permitir o treino"
        required: false
        default: "64"
        type: string
      max_train_examples:
        description: "Máximo de exemplos usados no teste (0 usa todos)"
        required: false
        default: "64"
        type: string
      focus_query:
        description: "Temas prioritários para a coleta de pesquisa do ciclo"
        required: false
        default: "artificial intelligence machine learning deep learning natural language processing NLP language models LLM agents reasoning alignment evaluation"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: atena-lora-training
  cancel-in-progress: false

jobs:
  train-and-notify:
    name: Coletar, treinar LoRA, avaliar e notificar
    runs-on: ubuntu-latest
    # O runner Ubuntu sem GPU leva cerca de 2 horas para concluir 64 exemplos.
    timeout-minutes: 180
    env:
      ATENA_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}
      ATENA_TRAIN_MODEL: "Qwen/Qwen2.5-0.5B-Instruct"
      ATENA_MIN_TRAIN_EXAMPLES: ${{ inputs.min_train_examples || '64' }}
      ATENA_MAX_TRAIN_EXAMPLES: ${{ inputs.max_train_examples || '64' }}
      ATENA_FOCUS_QUERY: ${{ inputs.focus_query || 'artificial intelligence machine learning deep learning natural language processing NLP language models LLM agents reasoning alignment evaluation' }}
      ATENA_AUTOTRAIN: "1"
      ATENA_TRAIN_EPOCHS: "1"
      ATENA_TRAIN_BATCH_SIZE: "1"
      ATENA_GRAD_ACCUMULATION: "1"
      ATENA_TRAIN_MAX_LENGTH: "128"
      ATENA_EVAL_MAX_LENGTH: "128"
      ATENA_MIN_EVAL_IMPROVEMENT: "0.02"
      ATENA_HOLDOUT_FRACTION: "0.2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      ATENA_TELEGRAM_BOT_TOKEN: ${{ secrets.ATENA_TELEGRAM_BOT_TOKEN }}
      ATENA_TELEGRAM_CHAT_ID: ${{ secrets.ATENA_TELEGRAM_CHAT_ID }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            setup/requirements-pinned.txt
            setup/requirements-autonomous-learning.txt
            pyproject.toml

      - name: Restaurar caches de dependências e modelos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .cache/huggingface
            .cache/piper
          key: ${{ runner.os }}-atena-lora-${{ hashFiles('setup/requirements-pinned.txt', 'setup/requirements-autonomous-learning.txt', 'pyproject.toml') }}-qwen05b-piper
          restore-keys: |
            ${{ runner.os }}-atena-lora-

      - name: Instalar dependências de coleta e treinamento
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r setup/requirements-pinned.txt
          python -m pip install -r setup/requirements-autonomous-learning.txt
          python -m pip install piper-tts

      - name: Pesquisar fontes RSS autônomas e persistir links
        run: |
          python scripts/fetch_research_sources.py --query "${ATENA_FOCUS_QUERY}" --max-sources 100 --limit-per-source 10 --max-pages 1000 --workers 16 --timeout 12 | tee /tmp/atena-research.json

      - name: Coletar experiências e montar datasets
        run: |
          git fetch origin atena/autoevolution || true
          for path in \
            atena_evolution/training/experiences.jsonl \
            atena_evolution/training/sft.jsonl \
            atena_evolution/training/preferences.jsonl \
            atena_evolution/training/human_feedback.jsonl \
            atena_evolution/training/telegram_interactions.jsonl \
            atena_evolution/vector_memory/indexed_ids.json \
            atena_evolution/vector_memory/entries.json \
            atena_evolution/vector_memory/embeddings.npy \
            atena_evolution/vector_memory/config.json \
            atena_evolution/vector_memory/index.bin; do
            if git cat-file -e "origin/atena/autoevolution:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "origin/atena/autoevolution:$path" > "$path"
            fi
          done
          python scripts/research_to_sft.py
          python scripts/atena_autonomous_learning.py collect | tee /tmp/atena-collection.json
          python scripts/index_long_term_memory.py

      - name: Executar motor principal da Atena em ciclo único
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          ATENA_ROBOT_DRY_RUN: "1"
          DEPLOY_GIT_REPO: ""
          DEPLOY_DOCKER_IMAGE: ""
          DEPLOY_COMMAND: ""
        run: |
          python main.py --auto --cycles 1 2>&1 | tee /tmp/atena-main-cycle.log

      - name: Treinar adaptador LoRA e avaliar candidato
        run: |
          python scripts/atena_autonomous_learning.py cycle --train | tee /tmp/atena-training.json
          python -m json.tool /tmp/atena-training.json >/dev/null

      - name: Versionar adapter promovido
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          ATENA_TRAIN_MODEL: ${{ env.ATENA_TRAIN_MODEL }}
        run: python scripts/prepare_adapter_release.py

      - name: Consolidar relatório do ciclo
        if: always()
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          try:
              collection = json.loads(Path('/tmp/atena-collection.json').read_text())
          except (FileNotFoundError, json.JSONDecodeError):
              collection = {
                  "status": "unavailable",
                  "reason": "a coleta de experiências não produziu JSON de resultado",
              }
          training_path = Path('/tmp/atena-training.json')
          try:
              training = json.loads(training_path.read_text())
          except (FileNotFoundError, json.JSONDecodeError):
              training = {
                  "status": "failed",
                  "reason": "o processo de treino terminou sem produzir JSON de resultado",
              }
          research_links = []
          db = Path('atena_evolution/memory.sqlite3')
          if db.exists():
              with sqlite3.connect(db) as conn:
                  for url, title, topic in conn.execute(
                      'SELECT url, title, topic FROM knowledge_documents ORDER BY fetched_at DESC LIMIT 20'
                  ):
                      if isinstance(url, str) and url.startswith(('http://', 'https://')):
                          research_links.append({"url": url, "title": title or topic or url})
          for source_file in (Path('atena_evolution/learning_memory.jsonl'), Path('atena_evolution/training/experiences.jsonl')):
              if not source_file.exists():
                  continue
              for line in source_file.read_text(encoding='utf-8', errors='replace').splitlines():
                  try:
                      item = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  refs = item.get('evidence') or item.get('evidence_refs') or item.get('sources') or []
                  if isinstance(refs, str):
                      refs = [refs]
                  for url in refs:
                      if isinstance(url, str) and url.startswith(('http://', 'https://')):
                          research_links.append({"url": url, "title": item.get('topic') or url})
          unique_links = []
          seen_links = set()
          for item in research_links:
              if item['url'] not in seen_links:
                  seen_links.add(item['url'])
                  unique_links.append(item)
          research_links = unique_links[:20]
          payload = {
              "workflow": "atena-lora-training",
              "run_id": "${{ github.run_id }}",
              "model": "${{ env.ATENA_TRAIN_MODEL }}",
              "training_status": "${{ job.status }}",
              "research_links": research_links,
              "collection": collection,
              "training": training,
          }
          output = Path('atena_evolution/training/latest_workflow_result.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(payload, ensure_ascii=False, indent=2))

      - name: Investigar gargalos sem alterar código
        if: always()
        run: python scripts/proactive_investigation.py

      - name: Avaliar desempenho do candidato no holdout
        run: |
          python scripts/evaluate_lora_performance.py \
            --report atena_evolution/training/latest_workflow_result.json \
            | tee /tmp/atena-performance-evaluation.json

      - name: Notificar resultado do treino no Telegram
        if: always()
        run: |
          python scripts/notify_telegram_training.py \
            --report atena_evolution/training/latest_workflow_result.json \
            --allow-missing

      - name: Gerar voz pt-BR e enviar aprendizagem em áudio
        if: always()
        run: |
          mkdir -p .cache/piper
          export ATENA_PIPER_BIN=piper
          export ATENA_PIPER_MODEL="$GITHUB_WORKSPACE/.cache/piper/pt_BR-faber-medium.onnx"
          export ATENA_PIPER_CONFIG="$GITHUB_WORKSPACE/.cache/piper/pt_BR-faber-medium.onnx.json"
          if [ ! -s "$ATENA_PIPER_MODEL" ]; then
            curl --fail --location --retry 3 \
              "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx?download=true" \
              --output "$ATENA_PIPER_MODEL"
          fi
          if [ ! -s "$ATENA_PIPER_CONFIG" ]; then
            curl --fail --location --retry 3 \
              "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json?download=true" \
              --output "$ATENA_PIPER_CONFIG"
          fi
          python scripts/notify_telegram_learning_audio.py \
            --report atena_evolution/training/latest_workflow_result.json \
            --allow-missing
          mkdir -p "$RUNNER_TEMP/atena-drive-upload"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from core.audio_gateway import AudioGateway
          from core.learning_audio import build_learning_spoken_text

          report = Path("atena_evolution/training/latest_workflow_result.json")
          spoken = build_learning_spoken_text(json.loads(report.read_text(encoding="utf-8")))
          output = Path(os.environ["RUNNER_TEMP"]) / "atena-drive-upload" / "learning.wav"
          AudioGateway().synthesize(spoken, output)
          print(f"Áudio persistido para o upload: {output.stat().st_size} bytes")
          PY

      - name: Publicar relatórios e candidato como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atena-lora-${{ github.run_id }}
          path: |
            atena_evolution/training/
            atena_evolution/models/
            /tmp/atena-performance-evaluation.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preparar credenciais do Google Drive
        if: always()
        env:
          GOOGLE_DRIVE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON_B64 }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_DRIVE_TOKEN_JSON_B64" ] || [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "::warning::Google Drive não configurado; upload ignorado. Configure GOOGLE_DRIVE_TOKEN_JSON_B64 e GOOGLE_DRIVE_FOLDER_ID."
            echo "ATENA_DRIVE_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          token_file="$RUNNER_TEMP/google-drive-token.json"
          printf '%s' "$GOOGLE_DRIVE_TOKEN_JSON_B64" | base64 --decode > "$token_file"
          chmod 600 "$token_file"
          python -m json.tool "$token_file" >/dev/null
          echo "GOOGLE_DRIVE_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          echo "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID" >> "$GITHUB_ENV"
          echo "ATENA_DRIVE_READY=true" >> "$GITHUB_ENV"

      - name: Enviar aprendizagem para o cérebro da Atena no Google Drive
        if: always()
        run: |
          set -euo pipefail
          if [ "${ATENA_DRIVE_READY:-false}" != "true" ]; then
            echo "Upload do Google Drive não executado."
            exit 0
          fi
          args=(
            --token "$GOOGLE_DRIVE_TOKEN_FILE"
            --folder-id "$GOOGLE_DRIVE_FOLDER_ID"
          )
          if [ -f atena_evolution/training/latest_workflow_result.json ]; then
            args+=(--report atena_evolution/training/latest_workflow_result.json)
          fi
          if [ -f atena_evolution/model_promotion_state.json ]; then
            args+=(--state atena_evolution/model_promotion_state.json)
          fi
          for path in \
            atena_evolution/training/experiences.jsonl \
            atena_evolution/training/sft.jsonl \
            atena_evolution/training/preferences.jsonl \
            atena_evolution/training/human_feedback.jsonl \
            atena_evolution/training/telegram_interactions.jsonl \
            atena_evolution/learning_memory.jsonl; do
            if [ -f "$path" ]; then
              args+=(--learning "$path")
            fi
          done
          if [ -f atena_evolution/vector_memory/indexed_ids.json ]; then
            args+=(--learning atena_evolution/vector_memory/indexed_ids.json)
          fi
          for path in atena_evolution/vector_memory/entries.json atena_evolution/vector_memory/embeddings.npy atena_evolution/vector_memory/config.json atena_evolution/vector_memory/index.bin; do
            if [ -f "$path" ]; then
              args+=(--learning "$path")
            fi
          done
          if [ -d atena_evolution/models/active ]; then
            args+=(--model atena_evolution/models/active)
          fi
          if [ -f "$RUNNER_TEMP/atena-drive-upload/learning.wav" ]; then
            args+=(--audio "$RUNNER_TEMP/atena-drive-upload/learning.wav")
          fi
          if [ "${#args[@]}" -le 4 ]; then
            echo "::warning::Nenhum artefato de aprendizagem encontrado para enviar ao Google Drive."
            exit 0
          fi
          python scripts/upload_learning_to_drive.py "${args[@]}"

      - name: Publicar memória e relatório na branch de autoevolução
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths="atena_evolution/training/experiences.jsonl atena_evolution/training/sft.jsonl atena_evolution/training/preferences.jsonl atena_evolution/training/human_feedback.jsonl atena_evolution/training/telegram_interactions.jsonl atena_evolution/training/latest_workflow_result.json atena_evolution/autonomous_learning_state.json atena_evolution/model_promotion_state.json atena_evolution/models/active_manifest.json atena_evolution/vector_memory/indexed_ids.json"
          publish_dir="${RUNNER_TEMP}/atena-autoevolution-worktree"
          for attempt in 1 2 3 4 5; do
            cd "$GITHUB_WORKSPACE"
            git fetch origin atena/autoevolution
            git worktree remove --force "$publish_dir" 2>/dev/null || true
            rm -rf "$publish_dir"
            git worktree add --detach "$publish_dir" origin/atena/autoevolution
            for path in $paths; do
              if test -e "$path"; then
                mkdir -p "$publish_dir/$(dirname "$path")"
                cp "$path" "$publish_dir/$path"
              fi
            done
            if test -d atena_evolution/models/active; then
              mkdir -p "$publish_dir/atena_evolution/models"
              rm -rf "$publish_dir/atena_evolution/models/active"
              cp -a atena_evolution/models/active "$publish_dir/atena_evolution/models/active"
            fi
            if test -d atena_evolution/models/releases; then
              mkdir -p "$publish_dir/atena_evolution/models"
              rm -rf "$publish_dir/atena_evolution/models/releases"
              cp -a atena_evolution/models/releases "$publish_dir/atena_evolution/models/releases"
            fi
            if test -d atena_evolution/proposals; then
              mkdir -p "$publish_dir/atena_evolution"
              cp -a atena_evolution/proposals "$publish_dir/atena_evolution/proposals"
            fi
            if test -d atena_evolution/vector_memory; then
              mkdir -p "$publish_dir/atena_evolution"
              cp -a atena_evolution/vector_memory "$publish_dir/atena_evolution/vector_memory"
            fi
            cd "$publish_dir"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for path in $paths; do
              test -e "$path" && git add "$path" || true
            done
            test -d atena_evolution/models/active && git add atena_evolution/models/active || true
            test -d atena_evolution/models/releases && git add atena_evolution/models/releases || true
            test -d atena_evolution/proposals && git add atena_evolution/proposals || true
            test -d atena_evolution/vector_memory && git add atena_evolution/vector_memory || true
            if git diff --cached --quiet; then
              echo "Nenhum estado novo para publicar."
              exit 0
            fi
            git commit -m "chore(atena): record LoRA training cycle"
            if git push origin HEAD:atena/autoevolution; then
              echo "Estado publicado na tentativa ${attempt}."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Não foi possível publicar após ${attempt} tentativas." >&2
              exit 1
            fi
            echo "Push concorrente; sincronizando e tentando novamente (${attempt}/5)."
            sleep $((attempt * 2))
          done

      - name: Validar configuração do workflow
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/atena-evolution-agent.yml').read_text()
          assert 'name: ATENA LoRA training and Telegram' in text
          assert 'scripts/atena_autonomous_learning.py cycle --train' in text
          assert 'scripts/notify_telegram_training.py' in text
          assert 'scripts/notify_telegram_learning_audio.py' in text
          assert 'scripts/upload_learning_to_drive.py' in text
          assert 'scripts/prepare_adapter_release.py' in text
          assert 'scripts/proactive_investigation.py' in text
          assert 'human_feedback.jsonl' in text
          assert 'models/active_manifest.json' in text
          assert 'GOOGLE_DRIVE_TOKEN_JSON_B64' in text
          assert 'GOOGLE_DRIVE_FOLDER_ID' in text
          assert 'atena-drive-upload/learning.wav' in text
          assert 'pt_BR-faber-medium.onnx' in text
          print('workflow assertions: OK')
          PY
