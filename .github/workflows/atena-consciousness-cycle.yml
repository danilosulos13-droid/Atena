name: ATENA Consciousness Cycle

# Ciclo manual de coleta de conhecimento com fonte e conteúdo verificáveis.
# O agendamento permanece desativado até que exista um consumidor real do arquivo.
on:
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Run ATENA evolution
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          mem_file = Path("memoria_atena.json")
          url = "https://pt.wikipedia.org/wiki/Intelig%C3%AAncia_artificial"
          headers = {
              "User-Agent": "Atena-IA/1.0 (research; +https://github.com/danilosulos13-droid/Atena)"
          }

          response = requests.get(url, headers=headers, timeout=20)
          response.raise_for_status()
          soup = BeautifulSoup(response.content, "html.parser")

          paragraphs = [
              node.get_text(" ", strip=True)
              for node in soup.select("main p, .mw-parser-output > p, p")
          ]
          content = next((text for text in paragraphs if len(text) >= 80), "")
          if not content:
              raise RuntimeError("A fonte não contém um parágrafo de conteúdo utilizável")

          title_node = soup.select_one("h1#firstHeading, h1")
          title = title_node.get_text(" ", strip=True) if title_node else "Inteligência artificial"
          now = dt.datetime.now(dt.timezone.utc).isoformat()

          if mem_file.exists():
              data = json.loads(mem_file.read_text(encoding="utf-8"))
          else:
              data = {"aprendizados": [], "ciclos_completos": 0}
          if not isinstance(data, dict):
              raise RuntimeError("memoria_atena.json não contém um objeto JSON")
          if not isinstance(data.get("aprendizados", []), list):
              raise RuntimeError("o campo aprendizados não é uma lista")

          aprendizado = {
              "timestamp": now,
              "fonte": "Wikipedia",
              "titulo_fonte": title,
              "url_fonte": url,
              "conhecimento_adquirido": content[:1000],
              "status": "validado",
          }
          data["aprendizados"].append(aprendizado)
          data["ciclos_completos"] = int(data.get("ciclos_completos", 0)) + 1
          mem_file.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"status": "ok", "ciclo": data["ciclos_completos"], "fonte": url}, ensure_ascii=False))
          PY

      - name: Commit novos conhecimentos
        run: |
          git config user.name "Atena-AI"
          git config user.email "atena@evolution.com"
          git add memoria_atena.json
          git diff --cached --quiet && { echo "Nenhum aprendizado novo."; exit 0; }
          git commit -m "Atena: registrar aprendizado validado"
          git push

      - name: Exportar aprendizados validados para o Telegram
        if: success()
        env:
          ATENA_TELEGRAM_BOT_TOKEN: ${{ secrets.ATENA_TELEGRAM_BOT_TOKEN }}
          ATENA_TELEGRAM_CHAT_ID: ${{ secrets.ATENA_TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          import requests

          token = os.environ.get("ATENA_TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("ATENA_TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise RuntimeError("Secrets do Telegram não configurados")

          data = json.loads(Path("memoria_atena.json").read_text(encoding="utf-8"))
          validated = [
              item for item in data.get("aprendizados", [])
              if isinstance(item, dict) and item.get("status") == "validado"
          ]
          if not validated:
              raise RuntimeError("Nenhum aprendizado validado para exportar")

          lines = [
              "<b>ATENA — aprendizado validado</b>",
              f"Ciclo: <code>{html.escape(str(data.get('ciclos_completos', '?')))}</code>",
              "",
          ]
          for index, item in enumerate(validated[-5:], 1):
              title = html.escape(str(item.get("titulo_fonte", item.get("fonte", "Fonte"))))
              excerpt = html.escape(" ".join(str(item.get("conhecimento_adquirido", "")).split())[:650])
              source_url = str(item.get("url_fonte", "")).strip()
              timestamp = html.escape(str(item.get("timestamp", "não informado")))
              lines.extend([
                  f"<b>{index}. {title}</b>",
                  f"Data: <code>{timestamp}</code>",
                  excerpt or "Trecho não disponível.",
                  (f'<a href="{html.escape(source_url, quote=True)}">Abrir fonte original</a>'
                   if source_url.startswith(("http://", "https://")) else "Fonte original não registrada."),
                  "",
              ])
          lines.append(f'<a href="{html.escape(os.environ["GITHUB_RUN_URL"], quote=True)}">Ver execução no GitHub Actions</a>')
          message = "\n".join(lines)
          if len(message) > 3900:
              message = message[:3890] + "…"

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": message, "parse_mode": "HTML", "disable_web_page_preview": True},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          if not payload.get("ok"):
              raise RuntimeError(payload.get("description", "Telegram rejeitou a mensagem"))
          print(f"Exportados {min(len(validated), 5)} aprendizados validados para o Telegram.")
